<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FantaGTS - Incontri e Risultati</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2d3748 0%, #1a202c 100%);
            min-height: 100vh;
            color: #e2e8f0;
            padding: 15px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            padding: 20px;
            background: rgba(0,0,0,0.4);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .section {
            background: rgba(255,255,255,0.08);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }

            .section h2 {
                margin-bottom: 15px;
                color: #4299e1;
                border-bottom: 2px solid #4299e1;
                padding-bottom: 8px;
                font-size: 1.3em;
            }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 5px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .btn-primary {
            background: #4299e1;
            color: white;
            border-color: #4299e1;
        }

        .btn-secondary {
            background: #4a5568;
            color: #e2e8f0;
            border-color: #4a5568;
        }

        .turni-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .turno-btn {
            padding: 10px 15px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

            .turno-btn.active {
                background: #4299e1;
                border-color: #4299e1;
                color: white;
            }

            .turno-btn:hover {
                border-color: #4299e1;
            }

        /* NUOVO LAYOUT A COLONNE */
        .layout-colonne-scontri {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .colonna-scontro {
            background: rgba(45, 55, 72, 0.8);
            border-radius: 12px;
            padding: 15px; /* era 20px */
            border: 2px solid rgba(255,255,255,0.1);
        }

        .header-squadre {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .badge-squadra {
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            color: inherit;
            text-align: center;
            min-width: 120px;
            font-size: 1em;
            line-height: 1.2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .vs-text {
            font-size: 1.2em;
            font-weight: bold;
            color: #f56565;
        }

        .incontro-block {
            margin-bottom: 15px; /* era 20px */
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 12px; /* era 15px */
            border: 1px solid rgba(255,255,255,0.1);
        }

        .riga-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .btn-azione {
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.9em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-reset {
            background: #ed8936;
            color: white;
        }

            .btn-reset:hover {
                background: #dd6b20;
            }

        .btn-conferma {
            background: #48bb78;
            color: white;
        }

            .btn-conferma:hover {
                background: #38a169;
            }

            .btn-conferma:disabled {
                background: #4a5568;
                color: #a0aec0;
                cursor: not-allowed;
                opacity: 0.6;
            }

        .etichetta-coppia {
            font-weight: bold;
            color: white;
            font-size: 1.1em;
        }

        .stato-incontro {
            font-size: 0.85em;
            padding: 4px 8px;
            border-radius: 10px;
            font-weight: bold;
        }

            .stato-incontro.completato {
                background: rgba(72, 187, 120, 0.3);
                color: #48bb78;
            }

            .stato-incontro.attesa {
                background: rgba(237, 137, 54, 0.3);
                color: #ed8936;
            }

        .confronto-coppie {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .coppia-box {
            flex: 1;
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            padding: 10px 8px; /* era 15px 12px */
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.85em; /* era 0.95em */
            line-height: 1.3; /* era 1.4 */
        }

            .coppia-box:hover {
                background-color: rgba(255,255,255,0.15) !important;
                transform: translateY(-2px);
                transition: all 0.2s ease;
            }

            .coppia-box[style*="pointer-events: auto"] {
                border: 1px solid rgba(66, 153, 225, 0.3);
            }

            .coppia-box.vincitore {
                background-color: rgba(72, 187, 120, 0.2) !important;
                border: 2px solid #48bb78 !important;
                box-shadow: 0 0 10px rgba(72, 187, 120, 0.3);
            }

        .vs-centrale {
            font-size: 1em;
            font-weight: bold;
            color: #f56565;
            min-width: 25px;
            text-align: center;
        }

        /* Colori squadre */
        .gialla {
            background-color: #f59e0b;
        }

        .azzurra {
            background-color: #06b6d4;
        }

        .rossa {
            background-color: #ef4444;
        }

        .verde {
            background-color: #10b981;
        }

        .smeraldo {
            background-color: #10b981;
        }

        .rosa {
            background-color: #ec4899;
        }

        .viola {
            background-color: #8b5cf6;
        }

        .arancione {
            background-color: #f97316;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            z-index: 1001;
            transform: translateX(400px);
            transition: transform 0.3s ease;
        }

            .notification.show {
                transform: translateX(0);
            }

            .notification.success {
                background: #48bb78;
            }

            .notification.error {
                background: #f56565;
            }

        @keyframes highlight {
            0% {
                background-color: rgba(66, 153, 225, 0.3);
            }

            50% {
                background-color: rgba(66, 153, 225, 0.6);
            }

            100% {
                background-color: transparent;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏟️ FantaGTS - Incontri e Risultati</h1>
            <p>Visualizza gli incontri e inserisci i risultati delle partite</p>
            <div style="margin-top: 15px;">
                <button class="btn btn-secondary" onclick="tornaAlMaster()">
                    ← Torna al Master
                </button>
                <button class="btn btn-primary" onclick="vaiAGestione()">
                    ⚙️ Gestione Incontri
                </button>
            </div>
        </div>

        <!-- Selezione Turno -->
        <div class="section">
            <h2>📅 Seleziona Turno</h2>
            <div id="turniSelector" class="turni-selector">
                <!-- I turni verranno caricati qui -->
            </div>
        </div>

        <!-- Incontri del Turno -->
        <div class="section" id="incontriSection" style="display: none;">
            <h2>🏆 Incontri - <span id="turnoSelezionatoNome">Turno</span></h2>
            <div id="incontriContainer">
                <!-- Gli incontri verranno caricati qui -->
            </div>
        </div>
    </div>

    <script>
        let turni = [];
        let turnoSelezionato = null;
        let incontriTurno = [];
        let incontriCaricati = [];
        let squadreDisponibili = [];
        let coppieTemporanee = [];
        let coppieVincenti = new Map();
        let risultatiSelezionati = new Map();
        let configurazioneCorrente = null;

        const selezioniCoppie = new Map(); // Tiene traccia delle selezioni per il nuovo sistema

        let punteggiPending = new Map();

        let sessioneCorrente = null;

        // Inizializzazione
        let socket = null;

        function initSocket() {
            if (socket) {
                console.log('⚠️ Socket già inizializzato');
                return;
            }

            socket = io();

            socket.on('connect', () => {
                console.log('✅ Socket.IO connesso in incontri.html');
            });

            socket.on('disconnect', () => {
                console.log('❌ Socket.IO disconnesso');
            });

            // 🎯 Listener per aggiornamenti punti
            socket.on('aggiornamento_punti', (data) => {
                console.log('📊 Ricevuto aggiornamento punti:', data);
                
                // Ricarica gli incontri del turno selezionato
                if (turnoSelezionato) {
                    console.log('🔄 Ricarico incontri del turno', turnoSelezionato.id);
                    caricaIncontriTurno(turnoSelezionato.id);
                }
            });

            console.log('✅ Socket.IO inizializzato con listener aggiornamento_punti');
        }

        document.addEventListener('DOMContentLoaded', async () => {
            initSocket(); // 🔌 Aggiungi questa riga QUI
            await caricaSessioneAttiva();
            await caricaSquadre();
            await caricaTurni();
            gestisciParametriURL();
        });

        // Carica sessione (da URL o attiva)
        async function caricaSessioneAttiva() {
            try {
                // 1️⃣ Controlla se c'è ?sessione=XXX nell'URL
                const urlParams = new URLSearchParams(window.location.search);
                const sessioneUrl = urlParams.get('sessione');
                const configUrl = urlParams.get('configurazione');

                // 2️⃣ Se c'è una configurazione diretta nell'URL, usala
                if (configUrl) {
                    console.log('🎯 Configurazione specificata nell\'URL:', configUrl);
                    configurazioneCorrente = configUrl;
                    sessioneCorrente = null; // Non serve una sessione per vedere gli incontri

                    // Aggiorna header
                    const header = document.querySelector('.header h1');
                    if (header) {
                        header.textContent = `FantaGTS - Incontri e Risultati - Configurazione ${configUrl}`;
                    }
                    return;
                }

                // 3️⃣ Se c'è una sessione nell'URL, prendi la sua configurazione
                if (sessioneUrl) {
                    console.log('🎯 Sessione specificata nell\'URL:', sessioneUrl);
                    const response = await fetch(`/api/sessioni/${sessioneUrl}`);

                    if (!response.ok) {
                        throw new Error(`Sessione ${sessioneUrl} non trovata`);
                    }

                    const data = await response.json();
                    sessioneCorrente = data.id;
                    configurazioneCorrente = data.configurazione_id;

                    console.log('✅ Sessione caricata:', sessioneCorrente);
                    console.log('✅ Configurazione:', configurazioneCorrente);

                    // Aggiorna header con nome sessione
                    const header = document.querySelector('.header h1');
                    if (header) {
                        header.textContent = `FantaGTS - Incontri e Risultati - ${data.nome}`;
                    }
                    return;
                }

                // 4️⃣ Fallback: cerca sessione attiva per avere un contesto
                console.log('🔍 Nessun parametro nell\'URL, cerco sessione attiva...');
                const response = await fetch('/api/sessione-attiva');

                if (response.ok) {
                    const data = await response.json();

                    if (data.sessione) {
                        sessioneCorrente = data.sessione.id;
                        configurazioneCorrente = data.sessione.configurazione_id;
                        console.log('✅ Sessione attiva caricata:', sessioneCorrente);
                        console.log('✅ Configurazione:', configurazioneCorrente);

                        // Aggiorna header
                        const header = document.querySelector('.header h1');
                        if (header) {
                            header.textContent = `FantaGTS - Incontri e Risultati - ${data.sessione.nome}`;
                        }
                        return;
                    }
                }

                // 5️⃣ Ultimo fallback: usa configurazione default
                console.warn('⚠️ Nessuna sessione attiva, uso configurazione default');
                configurazioneCorrente = 'default';
                sessioneCorrente = null;

                showNotification('Visualizzazione configurazione default', 'info');

            } catch (error) {
                console.error('Errore caricamento sessione:', error);
                showNotification(`Errore: ${error.message}`, 'error');

                // Fallback finale
                configurazioneCorrente = 'default';
                sessioneCorrente = null;
            }
        }

        // Funzione per gestire parametri URL
        function gestisciParametriURL() {
            const urlParams = new URLSearchParams(window.location.search);
            const turnoIdDaURL = urlParams.get('turno');

            if (turnoIdDaURL) {
                console.log('🎯 Turno specificato nell\'URL:', turnoIdDaURL);
                // Attendiamo che i turni siano caricati prima di selezionare
                setTimeout(() => selezionaTurnoAutomatico(turnoIdDaURL), 100);
            }
        }

        // Funzione per selezionare automaticamente il turno dall'URL
        async function selezionaTurnoAutomatico(turnoId) {
            const turno = turni.find(t => t.id == turnoId);
            if (turno) {
                console.log('✅ Turno trovato, selezione automatica:', turno);

                // Evidenzia il bottone del turno
                const turnoBtn = [...document.querySelectorAll('.turno-btn')].find(btn =>
                    btn.textContent.includes(`Turno ${turno.turno_numero}`)
                );
                if (turnoBtn) {
                    document.querySelectorAll('.turno-btn').forEach(btn => btn.classList.remove('active'));
                    turnoBtn.classList.add('active');
                }

                // Seleziona il turno
                turnoSelezionato = turno;
                document.getElementById('turnoSelezionatoNome').textContent = `${turno.nome_turno}`;

                // Carica gli incontri del turno
                await caricaIncontriTurno(turno.id);

                document.getElementById('incontriSection').style.display = 'block';
                document.getElementById('incontriSection').scrollIntoView({ behavior: 'smooth' });

                // Gestisci hash per incontro specifico
                if (window.location.hash) {
                    setTimeout(() => {
                        const elementoTarget = document.querySelector(window.location.hash);
                        if (elementoTarget) {
                            elementoTarget.scrollIntoView({ behavior: 'smooth' });
                            // Evidenzia l'incontro
                            elementoTarget.style.animation = 'highlight 2s ease-in-out';
                        }
                    }, 300);
                }
            } else {
                console.warn('⚠️ Turno non trovato per ID:', turnoId);
            }
        }

        // Funzione globale per caricare e trasformare le squadre
        // Funzione globale per caricare e trasformare le squadre
        async function caricaSquadre() {
            try {
                // Usa configurazione se sessione non disponibile
                const parametro = sessioneCorrente ? `sessione=${sessioneCorrente}` : `configurazione=${configurazioneCorrente}`;

                const response = await fetch(`/api/squadre-con-giocatori?${parametro}`);

                // Se la risposta del server non è ok, prova il fallback manuale
                if (!response.ok) {
                    console.warn('⚠️ Risposta non OK, eseguo fallback manuale di trasformazione');

                    const squadre = await response.json();
                    console.log('🔄 Trasformo manualmente i dati squadre:', squadre);

                    // Trasforma manualmente le squadre dal formato DB
                    squadreDisponibili = squadre.map(squadra => {
                        const giocatori = [];

                        // Aggiungi giocatori maschili
                        for (let i = 1; i <= 7; i++) {
                            const nomeGiocatore = squadra[`m${i}`];
                            if (nomeGiocatore && nomeGiocatore.trim() !== '') {
                                giocatori.push({
                                    posizione: `M${i}`,
                                    nome: nomeGiocatore.trim()
                                });
                            }
                        }

                        // Aggiungi giocatori femminili
                        for (let i = 1; i <= 3; i++) {
                            const nomeGiocatore = squadra[`f${i}`];
                            if (nomeGiocatore && nomeGiocatore.trim() !== '') {
                                giocatori.push({
                                    posizione: `F${i}`,
                                    nome: nomeGiocatore.trim()
                                });
                            }
                        }

                        console.log(`🎯 Squadra ${squadra.colore} trasformata:`, {
                            numero: squadra.numero,
                            colore: squadra.colore,
                            giocatori: giocatori.length
                        });

                        return {
                            numero: squadra.numero,
                            colore: squadra.colore,
                            giocatori: giocatori
                        };
                    });

                    console.log('✅ Squadre trasformate manualmente:', squadreDisponibili);
                    return; // Termina la funzione qui se il fallback ha funzionato
                }

                // Se la risposta è ok, leggi direttamente i dati dal server
                squadreDisponibili = await response.json();
                console.log('✅ Squadre con giocatori caricate dal server:', squadreDisponibili);

            } catch (error) {
                console.error('❌ Errore caricamento squadre:', error);
                showNotification(`Errore caricamento squadre: ${error.message}`, 'error');
                squadreDisponibili = [];
            }
        }


        // Carica turni disponibili
        async function caricaTurni() {
            try {
                const response = await fetch(`/api/turni?configurazione=${configurazioneCorrente}`);
                turni = await response.json();

                const container = document.getElementById('turniSelector');
                container.innerHTML = '';

                if (turni.length === 0) {
                    container.innerHTML = '<p>Nessun turno configurato</p>';
                    return;
                }

                turni.forEach(turno => {
                    const btn = document.createElement('div');
                    btn.className = 'turno-btn';
                    btn.textContent = `Turno ${turno.turno_numero}: ${turno.nome_turno}`;
                    btn.onclick = () => selezionaTurno(turno);
                    container.appendChild(btn);
                });

                // AGGIUNGI QUESTA RIGA:
                gestisciParametriURL();

            } catch (error) {
                console.error('Errore caricamento turni:', error);
                showNotification('Errore caricamento turni', 'error');
            }
        }

        // Seleziona turno
        async function selezionaTurno(turno) {
            // Aggiorna UI selezione
            document.querySelectorAll('.turno-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            turnoSelezionato = turno;
            document.getElementById('turnoSelezionatoNome').textContent = `${turno.nome_turno}`;

            // Carica incontri del turno
            await caricaIncontriTurno(turno.id);

            document.getElementById('incontriSection').style.display = 'block';
            document.getElementById('incontriSection').scrollIntoView({ behavior: 'smooth' });
        }

        // Carica incontri del turno selezionato
        async function caricaIncontriTurno(turnoId) {
            try {
                const response = await fetch(`/api/incontri-turno/${turnoId}?configurazione=${configurazioneCorrente}`);
                incontriCaricati = await response.json();

                const container = document.getElementById('incontriContainer');
                container.innerHTML = '';

                if (incontriCaricati.length === 0) {
                    container.innerHTML = '<p>Nessun incontro generato per questo turno</p>';
                    return;
                }

                // Raggruppa incontri per scontro tra squadre
                const incontriRaggruppati = {};

                incontriCaricati.forEach(incontro => {
                    // Ottieni colori squadre
                    const squadra1 = squadreDisponibili.find(s => s.numero === incontro.squadra1);
                    const squadra2 = squadreDisponibili.find(s => s.numero === incontro.squadra2);

                    const chiaveGruppo = `${squadra1?.colore || 'Sconosciuta'}_vs_${squadra2?.colore || 'Sconosciuta'}`;

                    if (!incontriRaggruppati[chiaveGruppo]) {
                        incontriRaggruppati[chiaveGruppo] = {
                            squadra1: squadra1,
                            squadra2: squadra2,
                            incontri: []
                        };
                    }

                    incontriRaggruppati[chiaveGruppo].incontri.push(incontro);
                });

                // Crea il nuovo layout a colonne
                const layoutColonne = document.createElement('div');
                layoutColonne.className = 'layout-colonne-scontri';

                // Crea una colonna per ogni scontro tra squadre
                Object.keys(incontriRaggruppati).forEach((chiaveGruppo) => {
                    const gruppo = incontriRaggruppati[chiaveGruppo];

                    // Crea colonna per lo scontro
                    const colonnaScontro = document.createElement('div');
                    colonnaScontro.className = 'colonna-scontro';

                    // Header dello scontro
                    const headerSquadre = document.createElement('div');
                    headerSquadre.className = 'header-squadre';

                    const squadra1Color = getTeamColor(gruppo.squadra1?.colore);
                    const squadra2Color = getTeamColor(gruppo.squadra2?.colore);

                    headerSquadre.innerHTML = `
        <div class="badge-squadra" style="background-color: ${squadra1Color}; color: ${getTextColorForTeam(gruppo.squadra1?.colore)};">
            SQUADRA<br>${gruppo.squadra1?.colore?.toUpperCase() || 'SCONOSCIUTA'}
        </div>
        <div class="vs-text">VS</div>
        <div class="badge-squadra" style="background-color: ${squadra2Color}; color: ${getTextColorForTeam(gruppo.squadra2?.colore)};">
            SQUADRA<br>${gruppo.squadra2?.colore?.toUpperCase() || 'SCONOSCIUTA'}
        </div>
`;

                    colonnaScontro.appendChild(headerSquadre);

                    // Aggiungi tutti gli incontri di questo scontro
                    gruppo.incontri.forEach(incontro => {
                        const incontroBlock = document.createElement('div');
                        incontroBlock.className = 'incontro-block';
                        incontroBlock.setAttribute('data-incontro-id', incontro.id);
                        incontroBlock.setAttribute('data-stato', incontro.completato ? 'completato' : 'attesa');

                        // Ottieni nomi giocatori
                        const pos1Squadra1 = gruppo.squadra1?.giocatori?.find(g => g.posizione === incontro.pos1);
                        const pos2Squadra1 = gruppo.squadra1?.giocatori?.find(g => g.posizione === incontro.pos2);
                        const pos1Squadra2 = gruppo.squadra2?.giocatori?.find(g => g.posizione === incontro.pos1);
                        const pos2Squadra2 = gruppo.squadra2?.giocatori?.find(g => g.posizione === incontro.pos2);

                        // Determina il pulsante azione e stato
                        let btnAzione, statoClasse, statoTesto;
                        if (incontro.completato) {
                            btnAzione = `<button class="btn-azione btn-reset" onclick="resetIncontroNuovo('${incontro.id}')">Reset</button>`;
                            statoClasse = 'completato';
                            statoTesto = '✓ Completato';
                        } else {
                            btnAzione = `<button class="btn-azione btn-conferma" disabled onclick="confermaIncontro('${incontro.id}')">Conferma</button>`;
                            statoClasse = 'attesa';
                            statoTesto = '⏳ In attesa';
                        }

            selezioniCoppie.delete(incontroId);
            const blocco = document.querySelector(`[data-incontro-id="${incontroId}"]`);

        // Conferma: valida i game, assegna il numero alto alla vincente, poi conferma l'incontro
        async function confermaPunteggio(incontroId, squadra, soloPunteggio) {
            const g1 = parseInt(document.getElementById('pp-g1').value);
            const g2 = parseInt(document.getElementById('pp-g2').value);

            if (isNaN(g1) || isNaN(g2) || g1 < 0 || g1 > 9 || g2 < 0 || g2 > 9) {
                showNotification('Inserisci due numeri da 0 a 9', 'error');
                return;
            }
            if (g1 === g2) {
                showNotification('Il vincitore deve avere piu game', 'error');
                return;
            }

            // il numero piu alto va alla coppia vincente
            const alto = Math.max(g1, g2);
            const basso = Math.min(g1, g2);
            const games_squadra1 = (squadra === 'squadra1') ? alto : basso;
            const games_squadra2 = (squadra === 'squadra1') ? basso : alto;

            const overlay = document.getElementById('popup-punteggio-overlay');
            if (overlay) overlay.remove();

            if (soloPunteggio) {
                // Incontro gia completato: salva SOLO i game, nessun punto e nessuna notifica
                try {
                    const response = await fetch(`/api/set-punteggio-incontro/${incontroId}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ games_squadra1, games_squadra2 })
                    });
                    if (!response.ok) {
                        const error = await response.json();
                        throw new Error(error.error);
                    }
                    const idxP = incontriCaricati.findIndex(i => i.id == incontroId);
                    if (idxP !== -1) {
                        incontriCaricati[idxP].games_squadra1 = games_squadra1;
                        incontriCaricati[idxP].games_squadra2 = games_squadra2;
                    }
                    showNotification('Punteggio salvato', 'success');
                    if (turnoSelezionato) caricaIncontriTurno(turnoSelezionato.id);
                } catch (err) {
                    showNotification('Errore: ' + err.message, 'error');
                }
                return;
            }

            // Incontro nuovo: memorizza il punteggio e procede con la conferma (vincitore + completa)
            punteggiPending.set(incontroId, { games_squadra1, games_squadra2 });
            await confermaIncontro(incontroId);
        }

        // FUNZIONE: Conferma incontro (passa da "Conferma" a "Reset" + "Completato")
        async function confermaIncontro(incontroId) {
            const squadraSelezionata = selezioniCoppie.get(incontroId);
            if (!squadraSelezionata) {
                showNotification('Seleziona prima una coppia vincente!', 'error');
                return;
            }

            try {
                // Trova l'incontro nei dati caricati
                const incontroData = incontriCaricati.find(i => i.id == incontroId);
                if (!incontroData) {
                    throw new Error('Dati incontro non trovati');
                }

                // 🔧 CORREZIONE: Usa il numero corretto della squadra
                const posizioni = [incontroData.pos1, incontroData.pos2];
                const numeroSquadraVincente = squadraSelezionata === 'squadra1' ? incontroData.squadra1 : incontroData.squadra2;
                const numVincitore = squadraSelezionata === 'squadra1' ? 1 : 2;

                console.log(`🔧 Correzione: squadraSelezionata=${squadraSelezionata}, numeroSquadraVincente=${numeroSquadraVincente}, numVincitore=${numVincitore}`);

                console.log(`[AUTO-SETUP] Creazione risultati per posizioni: ${posizioni.join(', ')}`);

                // Crea risultati per ogni posizione (automaticamente vince la squadra selezionata)
                const sq1 = squadreDisponibili.find(s => s.numero === incontroData.squadra1);
                const sq2 = squadreDisponibili.find(s => s.numero === incontroData.squadra2);

                for (const posizione of posizioni) {
                    // Recupera i nomi reali dei giocatori
                    const g1 = sq1?.giocatori?.find(g => g.posizione === posizione);
                    const g2 = sq2?.giocatori?.find(g => g.posizione === posizione);

                    const requestData = {
                        incontro_id: incontroId,
                        posizione: posizione,
                        vincitore: numVincitore,
                        giocatore_squadra1: g1 ? g1.nome : `${posizione} Squadra ${incontroData.squadra1}`,
                        giocatore_squadra2: g2 ? g2.nome : `${posizione} Squadra ${incontroData.squadra2}`,
                        punti_assegnati: turnoSelezionato?.punti_vittoria || 1
                    };

                    const response = await fetch('/api/set-vincitore', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(requestData)
                    });

                    if (!response.ok) {
                        const error = await response.json();
                        throw new Error(`Errore impostazione ${posizione}: ${error.error}`);
                    }

                    console.log(`[OK] Vincitore ${posizione} impostato`);
                }

                // Ora completa l'incontro (legge i risultati già salvati dal database)
                console.log(`📤 Chiamata API completa-incontro/${incontroId}`);

                // Prepara i parametri URL includendo la configurazione
                const params = new URLSearchParams();
                if (sessioneCorrente) {
                    params.append('sessione', sessioneCorrente);
                }
                if (configurazioneCorrente) {
                    params.append('configurazione', configurazioneCorrente);
                }

                const completaResponse = await fetch(`/api/completa-incontro/${incontroId}?${params.toString()}`, {
                    method: 'POST'
                });

                console.log(`📥 Risposta API: status=${completaResponse.status}`);

                if (!completaResponse.ok) {
                    const errorText = await completaResponse.text();
                    console.error('❌ Errore dal server:', errorText);

                    try {
                        const error = JSON.parse(errorText);
                        throw new Error(error.error || errorText);
                    } catch (parseError) {
                        throw new Error(`Errore HTTP ${completaResponse.status}: ${errorText}`);
                    }
                }

                // Successo!
                const result = await completaResponse.json();
                console.log('[SUCCESSO] Incontro completato:', result);

                // Salva il punteggio della coppia se inserito dal popup
                const punteggio = punteggiPending.get(incontroId);
                if (punteggio) {
                    await fetch(`/api/set-punteggio-incontro/${incontroId}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(punteggio)
                    });
                    const idxP = incontriCaricati.findIndex(i => i.id == incontroId);
                    if (idxP !== -1) {
                        incontriCaricati[idxP].games_squadra1 = punteggio.games_squadra1;
                        incontriCaricati[idxP].games_squadra2 = punteggio.games_squadra2;
                    }
                    punteggiPending.delete(incontroId);
                }

                // Aggiorna interfaccia locale
                aggiornaInterfacciaDopoConferma(incontroId);
                showNotification(`Incontro completato! ${result.risultato}`, 'success');

                // Aggiorna i dati in memoria per riflettere lo stato completato
                const incontroIndex = incontriCaricati.findIndex(i => i.id == incontroId);
                if (incontroIndex !== -1) {
                    incontriCaricati[incontroIndex].completato = true;
                    // Determina i risultati basandosi sulla squadra vincente
                    if (squadraSelezionata === 'squadra1') {
                        incontriCaricati[incontroIndex].risultato_coppia1 = 'Vittoria';
                        incontriCaricati[incontroIndex].risultato_coppia2 = 'Sconfitta';
                    } else if (squadraSelezionata === 'squadra2') {
                        incontriCaricati[incontroIndex].risultato_coppia1 = 'Sconfitta';
                        incontriCaricati[incontroIndex].risultato_coppia2 = 'Vittoria';
                    }
                    console.log(`📝 Dati in memoria aggiornati per incontro ${incontroId}`);
                }

                // Salva anche nel sistema esistente per compatibilità
                coppieVincenti.set(incontroId, squadraSelezionata);

            } catch (error) {
                console.error('[ERRORE CONFERMA]', error);
                showNotification(`Errore: ${error.message}`, 'error');
            }
        }

        // FUNZIONE: Aggiorna interfaccia dopo conferma
        function aggiornaInterfacciaDopoConferma(incontroId) {
            const blocco = document.querySelector(`[data-incontro-id="${incontroId}"]`);
            if (!blocco) return;

            // Trova l'incontro nei dati per ottenere i colori delle squadre
            const incontro = incontriCaricati.find(i => i.id == incontroId);
            if (!incontro) return;

            const squadra1 = squadreDisponibili.find(s => s.numero === incontro.squadra1);
            const squadra2 = squadreDisponibili.find(s => s.numero === incontro.squadra2);
            if (!squadra1 || !squadra2) return;

            // Ottieni quale squadra ha vinto
            const squadraVincente = selezioniCoppie.get(incontroId);
            console.log(`🎨 Colorando celle per incontro ${incontroId}, vincitore: ${squadraVincente}`);

            // Determina il colore della squadra vincente e quale coppia colorare
            let coloreVincente;
            let squadraVincenteAttr; // 'squadra1' o 'squadra2'

            // Se squadraVincente è una stringa ('squadra1'/'squadra2'), usala direttamente
            if (squadraVincente === 'squadra1' || squadraVincente === 'squadra2') {
                squadraVincenteAttr = squadraVincente;
                if (squadraVincente === 'squadra1') {
                    coloreVincente = getTeamColor(squadra1.colore);
                } else {
                    coloreVincente = getTeamColor(squadra2.colore);
                }
            } else {
                // Se squadraVincente è un numero (dalla DB), converti in 'squadra1'/'squadra2'
                if (squadraVincente == incontro.squadra1) {
                    squadraVincenteAttr = 'squadra1';
                    coloreVincente = getTeamColor(squadra1.colore);
                } else if (squadraVincente == incontro.squadra2) {
                    squadraVincenteAttr = 'squadra2';
                    coloreVincente = getTeamColor(squadra2.colore);
                }
            }

            console.log(`🔧 Debug: squadraVincente=${squadraVincente}, squadraVincenteAttr=${squadraVincenteAttr}, colore=${coloreVincente}`);

            // Colora le celle dei giocatori
            const coppie = blocco.querySelectorAll('.coppia-box');
            coppie.forEach(coppia => {
                const squadraAttr = coppia.getAttribute('data-squadra');

                const vincitore = (squadraAttr === squadraVincente);

                if (vincitore) {
                    // Applica stile vincente - RIMUOVI !important e usa setProperty
                    coppia.style.setProperty('background', `linear-gradient(135deg, ${coloreVincente}70, ${coloreVincente}90)`, 'important');
                    coppia.style.setProperty('border', `3px solid ${coloreVincente}`, 'important');
                    coppia.style.setProperty('color', '#ffffff', 'important');
                    coppia.style.setProperty('font-weight', 'bold', 'important');
                    coppia.style.setProperty('text-shadow', '0 2px 4px rgba(0,0,0,0.8)', 'important');
                    coppia.style.setProperty('box-shadow', `0 0 20px ${coloreVincente}90`, 'important');

                    console.log(`✅ Coppia vincente colorata: ${squadraAttr} con ${coloreVincente}`);
                } else {
                    // Stile perdente
                    coppia.style.setProperty('opacity', '0.4', 'important');
                    coppia.style.setProperty('filter', 'grayscale(60%)', 'important');
                    coppia.style.setProperty('background', 'rgba(255,255,255,0.02)', 'important');

                    console.log(`🔸 Coppia perdente sfumata: ${squadraAttr}`);
                }

                // Disabilita il click (incontro completato)
                coppia.style.pointerEvents = 'none';
            });

            // Aggiorna stato del blocco
            blocco.setAttribute('data-stato', 'completato');

            // Cambia pulsante da "Conferma" a "Reset"
            const rigaInfo = blocco.querySelector('.riga-info');
            const btnAzione = rigaInfo.querySelector('.btn-azione');
            btnAzione.className = 'btn-azione btn-reset';
            btnAzione.textContent = 'Reset';
            btnAzione.disabled = false;
            btnAzione.setAttribute('onclick', `resetIncontroNuovo('${incontroId}')`);

            // Aggiorna stato da "⏳ In attesa" a "✓ Completato"
            const statoElement = rigaInfo.querySelector('.stato-incontro');
            statoElement.className = 'stato-incontro completato';
            statoElement.textContent = '✓ Completato';

            // Aggiorna anche l'overview se siamo in gestione-incontri
            if (typeof aggiornaOverviewDopoConferma === 'function') {
                aggiornaOverviewDopoConferma(incontroId, squadraVincente);
            }
        }

        // FUNZIONE: Reset incontro (nuovo sistema)
        async function resetIncontroNuovo(incontroId) {
            if (!confirm('Resettare questo incontro? Dovrai selezionare nuovamente il vincitore.')) {
                return;
            }

            console.log(`[RESET NUOVO] Incontro ${incontroId}`);

            try {
                // Chiamata API per resettare
                const response = await fetch(`/api/reset-incontro/${incontroId}?sessione=${sessioneCorrente}`, {
                    method: 'POST'
                });

                if (response.ok) {
                    // Rimuovi la selezione dalle mappe
                    selezioniCoppie.delete(incontroId);
                    coppieVincenti.delete(incontroId);

                    // Aggiorna interfaccia locale
                    aggiornaInterfacciaDopoReset(incontroId);
                    showNotification('Incontro resettato con successo!', 'success');
                } else {
                    const error = await response.json();
                    throw new Error(error.error || 'Errore durante il reset');
                }

            } catch (error) {
                console.error('[ERRORE RESET]', error);
                showNotification(`Errore: ${error.message}`, 'error');
            }
        }

        // FUNZIONE: Aggiorna interfaccia dopo reset
        function aggiornaInterfacciaDopoReset(incontroId) {
            console.log(`[AGGIORNA UI RESET] Incontro ${incontroId}`);

            const blocco = document.querySelector(`[data-incontro-id="${incontroId}"]`);
            if (!blocco) {
                console.error(`Blocco incontro ${incontroId} non trovato!`);
                return;
            }

            // Aggiorna stato del blocco
            blocco.setAttribute('data-stato', 'attesa');

            // Cambia pulsante da "Reset" a "Conferma" disabilitato
            const rigaInfo = blocco.querySelector('.riga-info');
            const btnAzione = rigaInfo.querySelector('.btn-azione');
            if (btnAzione) {
                btnAzione.className = 'btn-azione btn-conferma';
                btnAzione.textContent = 'Conferma';
                btnAzione.disabled = true;
                btnAzione.setAttribute('onclick', `confermaIncontro('${incontroId}')`);
            }

            // Aggiorna stato da "✓ Completato" a "⏳ In attesa"
            const statoElement = rigaInfo.querySelector('.stato-incontro');
            if (statoElement) {
                statoElement.className = 'stato-incontro attesa';
                statoElement.textContent = '⏳ In attesa';
            }

            // FIX CRITICO: Riabilita selezione coppie e RESET COMPLETO STILI
            const coppie = blocco.querySelectorAll('.coppia-box');
            coppie.forEach(coppia => {
                // Rimuovi vincitore
                coppia.classList.remove('vincitore');

                // RESET COMPLETO di tutti gli stili applicati
                coppia.style.pointerEvents = 'auto';
                coppia.style.opacity = '1';
                coppia.style.background = 'rgba(255,255,255,0.08)';
                coppia.style.borderColor = 'rgba(255,255,255,0.2)';
                coppia.style.color = '#e2e8f0';
                coppia.style.fontWeight = 'normal';
                coppia.style.textShadow = 'none';
                coppia.style.boxShadow = 'none';
                coppia.style.filter = 'none';
                coppia.style.border = '2px solid rgba(255,255,255,0.2)';

                // RIATTIVA GLI ONCLICK
                const squadra = coppia.getAttribute('data-squadra');
                coppia.setAttribute('onclick', `selezionaCoppia('${incontroId}', '${squadra}')`);
                coppia.style.cursor = 'pointer';
            });

            // Aggiorna anche l'overview se siamo in gestione-incontri
            if (typeof aggiornaOverviewDopoReset === 'function') {
                aggiornaOverviewDopoReset(incontroId);
            }

            console.log(`[RESET UI OK] Incontro ${incontroId} pronto per nuova selezione`);
        }

        // Utility functions
        function getTeamColor(nomeColore) {
            const colori = {
                'rosso': '#ef4444',
                'rossa': '#ef4444',
                'blu': '#3b82f6',
                'verde': '#03ac41',
                'giallo': '#f59e0b',
                'gialla': '#f59e0b',
                'viola': '#8b5cf6',
                'arancione': '#f97316',
                'arancio': '#f97316',
                'rosa': '#ec4899',
                'azzurro': '#06b6d4',
                'azzurra': '#06b6d4',
                'marrone': '#92400e',
                'nero': '#374151',
                'nera': '#374151',
                'bianco': '#f3f4f6',
                'bianca': '#f3f4f6',
                'grigio': '#6b7280',
                'grigia': '#6b7280',
                'smeraldo': '#29b98c',
                'bordeaux': '#7c2d12',
                'lime': '#84cc16',
                'indaco': '#6366f1',
                'fucsia': '#d946ef',
                'ciano': '#06b6d4',
                'royal': '#1e40af',
                'crema': '#fef3c7',
                'lilla': '#c4b5fd'
            };
            const coloreLower = (nomeColore || '').toLowerCase().trim();
            return colori[coloreLower] || '#6b7280';
        }

        function getTextColorForTeam(nomeColore) {
            const coloriChiari = [
                'bianco', 'bianca', 'giallo', 'gialla', 'crema', 'lime',
                'rosa', 'rosa chiaro', 'rosa chiara',
                'celeste', 'azzurro chiaro', 'azzurra chiara',
                'verde chiaro', 'verde chiara', 'arancione chiaro', 'arancione chiara',
                'grigio chiaro', 'grigia chiara', 'argento', 'argentato', 'argentata',
                'sabbia', 'beige', 'lavanda', 'oro', 'dorato', 'dorata',
                'lilla', 'menta', 'bianca pura'
            ];
            const coloreLowerCase = (nomeColore || '').toLowerCase().trim();
            const isChiaro = coloriChiari.some(c =>
                coloreLowerCase === c || coloreLowerCase.includes(c) || c.includes(coloreLowerCase)
            );
            return isChiaro ? '#1a202c' : '#ffffff';
        }

        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => notification.classList.add('show'), 100);
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }

        function tornaAlMaster() {
            if (sessioneCorrente) {
                window.location.href = '/master?sessione=' + sessioneCorrente;
            } else {
                window.location.href = '/master';
            }
        }

        function vaiAGestione() {
            // Passa la configurazione corrente a gestione-incontri
            if (configurazioneCorrente) {
                window.location.href = `/gestione-incontri?configurazione=${configurazioneCorrente}`;
            } else {
                window.location.href = '/gestione-incontri';
            }
        }
    </script>
